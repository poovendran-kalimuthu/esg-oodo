<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GreenLedger — ESG Governance Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
    <style>
      * { font-family: 'DM Sans', sans-serif; }
      .font-display { font-family: 'Poppins', sans-serif; }
      body {
        background-color: #f4f6f2;
        background-image:
          radial-gradient(circle at 8% 8%, rgba(16, 185, 129, 0.07), transparent 40%),
          radial-gradient(circle at 95% 15%, rgba(52, 211, 153, 0.08), transparent 35%),
          radial-gradient(circle at 50% 100%, rgba(6, 78, 59, 0.04), transparent 50%);
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
      .nav-item {
        transition: all .18s ease;
      }
      .nav-item:hover:not(.nav-active) {
        background: rgba(16, 185, 129, 0.06);
        color: #064e3b;
      }
      .nav-active {
        background: linear-gradient(135deg, #10b981, #059669);
        color: white;
        box-shadow: 0 4px 14px -3px rgba(16, 185, 129, 0.45);
      }
    </style>
  </head>
  <body class="min-h-screen text-ink-900 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
